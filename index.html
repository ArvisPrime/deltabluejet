<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="DeltaBlue Jet Air — Book flights, manage bookings, check in online, and track flights across our intercontinental route network.">
    <meta name="theme-color" content="#137fec">
    <meta property="og:title" content="DeltaBlue Jet Air">
    <meta property="og:description" content="Intercontinental aviation — book flights, manage your journey, and explore destinations.">
    <meta property="og:type" content="website">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://firestore.googleapis.com">
    <link rel="preconnect" href="https://images.unsplash.com">
    <title>DeltaBlue Jet Air</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Manrope', 'sans-serif'],
                        display: ['Plus Jakarta Sans', 'Manrope', 'sans-serif'],
                    },
                    animation: {
                        'slow-zoom': 'slow-zoom 20s infinite alternate',
                        'progress-fast': 'progress 2s ease-in-out infinite',
                        'scroll-text': 'scroll-text 30s linear infinite',
                        'pulse-slow': 'pulse-slow 2s ease-in-out infinite',
                        'flight-move': 'flight-move 3s ease-in-out infinite',
                        'boarding-glow': 'boarding-glow 2s ease-in-out infinite',
                    },
                    keyframes: {
                        'slow-zoom': {
                            '0%': { transform: 'scale(1)' },
                            '100%': { transform: 'scale(1.1)' }
                        },
                        'progress': {
                            '0%': { transform: 'translateX(-100%)' },
                            '100%': { transform: 'translateX(100%)' }
                        },
                        'scroll-text': {
                            '0%': { transform: 'translateX(0)' },
                            '100%': { transform: 'translateX(-33.3%)' }
                        },
                        'pulse-slow': {
                            '0%, 100%': { boxShadow: '0 0 0 0 rgba(239,68,68,0.4)' },
                            '50%': { boxShadow: '0 0 20px 4px rgba(239,68,68,0.3)' }
                        },
                        'flight-move': {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-2px)' }
                        },
                        'boarding-glow': {
                            '0%, 100%': { boxShadow: '0 0 0 0 rgba(245,158,11,0.3)' },
                            '50%': { boxShadow: '0 0 15px 3px rgba(245,158,11,0.2)' }
                        }
                    },
                    colors: {
                        primary: {
                            DEFAULT: '#137fec',
                            50: '#f0f7ff',
                            100: '#e0effe',
                            200: '#bae0fd',
                            300: '#7cc7fb',
                            400: '#36abf7',
                            500: '#137fec',
                            600: '#0665cc',
                            700: '#0751a4',
                            800: '#0b4586',
                            900: '#0f3a6f',
                        },
                        navy: {
                            50: '#f6f7f9',
                            100: '#eceef2',
                            200: '#d5dae2',
                            300: '#b0b9c9',
                            400: '#8593aa',
                            500: '#64748b',
                            600: '#4e5b72',
                            700: '#3f495c',
                            800: '#333b4a',
                            900: '#1e2634',
                            950: '#101922',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            vertical-align: middle;
        }

        .material-symbols-outlined.filled {
            font-variation-settings: 'FILL' 1;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        .dark ::-webkit-scrollbar-thumb {
            background: #475569;
        }
    </style>
</head>

<body class="bg-navy-50 text-navy-950 font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
