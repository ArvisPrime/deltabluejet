<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeltaBlue Jet Air — Intercontinental Aviation</title>

    <!-- SEO Meta -->
    <meta name="description" content="DeltaBlue Jet Air — Book flights, manage bookings, check in online, and track flights across our intercontinental route network. Affordable fares from The Gambia to the world.">
    <meta name="keywords" content="DeltaBlue Jet Air, Deltablue, airline, flights, book flights, The Gambia, Nigeria, West Africa, intercontinental aviation, flight booking, check-in online, manage booking, flight tracker, African airline">
    <meta name="author" content="DeltaBlue Jet Air">
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
    <meta name="theme-color" content="#137fec">
    <meta name="application-name" content="DeltaBlue Jet Air">
    <!-- canonical URL is set dynamically per route by React Helmet / page components -->

    <!-- Geo Tags — Business presence -->
    <meta name="geo.region" content="GM">
    <meta name="geo.placename" content="The Gambia">

    <!-- Open Graph -->
    <meta property="og:site_name" content="DeltaBlue Jet Air">
    <meta property="og:title" content="DeltaBlue Jet Air — Intercontinental Aviation">
    <meta property="og:description" content="Book flights, manage bookings, check in online, and track flights across our intercontinental route network. Affordable fares from The Gambia to the world.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://deltabluejetair.com/">
    <meta property="og:image" content="https://deltabluejetair.com/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="DeltaBlue Jet Air — Intercontinental Aviation logo with aircraft">
    <meta property="og:locale" content="en_US">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="DeltaBlue Jet Air — Intercontinental Aviation">
    <meta name="twitter:description" content="Book flights, manage bookings, check in online, and track flights across our intercontinental route network.">
    <meta name="twitter:image" content="https://deltabluejetair.com/og-image.png">
    <meta name="twitter:image:alt" content="DeltaBlue Jet Air — Intercontinental Aviation logo with aircraft">

    <!-- Favicon & PWA -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="48x48">
    <link rel="icon" type="image/png" href="/logo192.png" sizes="192x192">
    <link rel="apple-touch-icon" sizes="192x192" href="/logo192.png">
    <link rel="apple-touch-icon" sizes="512x512" href="/logo512.png">
    <link rel="manifest" href="/manifest.json">

    <!-- Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://firestore.googleapis.com">
    <link rel="preconnect" href="https://images.unsplash.com">

    <!-- Fonts (non-render-blocking: load asynchronously via media swap) -->
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet" media="print" onload="this.media='all'">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL@20..48,400,0..1&display=swap"
        rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript>
        <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL@20..48,400,0..1&display=swap" rel="stylesheet" />
    </noscript>

    <!-- JSON-LD Structured Data: Organization -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "Airline",
        "@id": "https://deltabluejetair.com/#organization",
        "name": "DeltaBlue Jet Air",
        "alternateName": "Deltablue Jet Air",
        "url": "https://deltabluejetair.com",
        "logo": {
            "@type": "ImageObject",
            "url": "https://deltabluejetair.com/logo512.png",
            "width": 512,
            "height": 512
        },
        "image": "https://deltabluejetair.com/og-image.png",
        "description": "DeltaBlue Jet Air is an intercontinental airline providing safe, affordable, and exceptional air travel. Based in The Gambia, we connect West Africa to the global community with modern fleet operations and digital-first passenger services.",
        "foundingDate": "2012",
        "foundingLocation": {
            "@type": "Place",
            "name": "The Gambia"
        },
        "areaServed": [
            {
                "@type": "GeoCircle",
                "geoMidpoint": {
                    "@type": "GeoCoordinates",
                    "latitude": 13.4432,
                    "longitude": -15.3101
                },
                "description": "The Gambia and West Africa"
            },
            "Worldwide"
        ],
        "slogan": "Intercontinental Aviation",
        "contactPoint": [
            {
                "@type": "ContactPoint",
                "contactType": "customer service",
                "email": "support@deltabluejetair.com",
                "availableLanguage": ["English"]
            },
            {
                "@type": "ContactPoint",
                "contactType": "reservations",
                "email": "bookings@deltabluejetair.com",
                "availableLanguage": ["English"]
            }
        ],
        "address": {
            "@type": "PostalAddress",
            "addressCountry": "GM",
            "addressLocality": "The Gambia"
        },
        "sameAs": []
    }
    </script>

    <!-- JSON-LD Structured Data: WebSite (enables sitelinks search box) -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "DeltaBlue Jet Air",
        "url": "https://deltabluejetair.com",
        "description": "Book flights, manage bookings, check in online, and track flights across our intercontinental route network.",
        "publisher": {
            "@id": "https://deltabluejetair.com/#organization"
        },
        "potentialAction": {
            "@type": "SearchAction",
            "target": {
                "@type": "EntryPoint",
                "urlTemplate": "https://deltabluejetair.com/book?q={search_term_string}"
            },
            "query-input": "required name=search_term_string"
        }
    }
    </script>

    <!-- JSON-LD Structured Data: BreadcrumbList for homepage -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "BreadcrumbList",
        "itemListElement": [
            {
                "@type": "ListItem",
                "position": 1,
                "name": "Home",
                "item": "https://deltabluejetair.com/"
            },
            {
                "@type": "ListItem",
                "position": 2,
                "name": "Destinations",
                "item": "https://deltabluejetair.com/destinations"
            },
            {
                "@type": "ListItem",
                "position": 3,
                "name": "Book a Flight",
                "item": "https://deltabluejetair.com/book"
            },
            {
                "@type": "ListItem",
                "position": 4,
                "name": "About Us",
                "item": "https://deltabluejetair.com/about"
            }
        ]
    }
    </script>
</head>

<body class="bg-navy-50 text-navy-950 font-sans">
